<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel da Igreja</title>
<style>
:root{--bg:#f5f3ee;--card:#fff;--tx:#1f2a37;--mut:#6b7280;--br:#e5e1d8;--pri:#3b5bdb;--pri2:#e7ecff;--ok:#2f9e6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1d2026;--tx:#eceef2;--mut:#9aa1ad;--br:#2b2f37;--pri:#7c93ff;--pri2:#252b44;--ok:#4cc38a}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1d2026;--tx:#eceef2;--mut:#9aa1ad;--br:#2b2f37;--pri:#7c93ff;--pri2:#252b44;--ok:#4cc38a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0}h2{font-size:17px;margin:0 0 12px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--br);border-radius:12px;padding:4px}
.tabs button{border:0;background:none;color:var(--mut);padding:8px 14px;border-radius:9px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--pri);color:#fff}
.card{background:var(--card);border:1px solid var(--br);border-radius:16px;padding:18px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--br);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus{outline:2px solid var(--pri);border-color:transparent}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--pri2);color:var(--pri)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.choice button{flex:1;min-width:120px}
.choice button.on{background:var(--pri);color:#fff}
.rel{border:1px dashed var(--br);border-radius:12px;padding:14px;margin-bottom:12px;position:relative}
.rel .x{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--mut);cursor:pointer;font-size:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--br);border-radius:16px;padding:16px}
.kpi b{display:block;font-size:30px;line-height:1.1}.kpi span{color:var(--mut);font-size:13px}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:14px}
.bar i{flex:0 0 96px;color:var(--mut);font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar div{flex:1;height:10px;background:var(--pri2);border-radius:6px;overflow:hidden}
.bar div u{display:block;height:100%;background:var(--pri);border-radius:6px}
.bar em{font-style:normal;width:28px;text-align:right}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--br);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;background:var(--pri2);color:var(--pri)}
.tag.c{background:#fff3e0;color:#b76e00}
.ok{text-align:center;padding:30px 10px}.ok h2{color:var(--ok);font-size:22px}
.note{font-size:13px;color:var(--mut);margin-top:8px}
.hide{display:none!important}
.hero h1{font-size:24px}.inv{margin:6px 0 2px;color:var(--tx)}.vs{margin:0;font-style:italic;color:var(--mut);font-size:14px}.vs b{font-style:normal;color:var(--pri)}
.sub{margin:16px 0 8px;font-weight:600;color:var(--tx)}.chips{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:flex;align-items:center;gap:6px;margin:0;padding:7px 12px;border:1px solid var(--br);border-radius:99px;color:var(--tx);font-size:14px;cursor:pointer}
.chk input{width:auto;margin:0}.chk:has(input:checked){background:var(--pri2);border-color:var(--pri);color:var(--pri)}
td{max-width:260px;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="hero"><h1>📊 Painel da Igreja</h1><p class="vs">Área restrita — cadastros recebidos</p></div>
  </header>


<section id="vDash">
  <div id="gate" class="card" style="max-width:380px;margin:0 auto"><h2>🔒 Área restrita</h2><p class="note">Entre com o e-mail e a senha de administrador.</p><input id="em" type="email" placeholder="E-mail" style="margin-bottom:8px"><input id="pw" type="password" placeholder="Senha" autocomplete="off"><div class="row" style="margin-top:12px"><button class="btn" id="enter" type="button">Entrar</button><span id="pwErr" class="note" style="color:#d33"></span></div></div>
  <div id="dashBody" class="hide">
  <div class="card">
    <div class="grid" id="filters"></div>
    <div class="row" style="margin-top:12px"><button class="btn ghost" id="clr" type="button">Limpar filtros</button><button class="btn ghost" id="csv" type="button">⬇ Baixar cópia (CSV)</button><button class="btn ghost hide" id="purge" type="button">🧹 Apagar versões antigas</button><button class="btn ghost" id="lock" type="button">🔒 Sair</button><span class="note" id="cntr"></span><span class="note" id="oldNote"></span></div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="grid" style="margin-bottom:14px">
    <div class="card"><h2>Gênero</h2><div id="cGen"></div></div>
    <div class="card"><h2>Identificação</h2><div id="cSit"></div></div>
    <div class="card"><h2>Faixa etária</h2><div id="cAge"></div></div>
    <div class="card"><h2>Nacionalidade</h2><div id="cNac"></div></div>
    <div class="card"><h2>Servem nos ministérios</h2><div id="cSrv"></div></div>
    <div class="card"><h2>Interesse em servir</h2><div id="cInt"></div></div>
    <div class="card"><h2>Estado civil</h2><div id="cEst"></div></div>
    <div class="card"><h2>Como ingressaram</h2><div id="cIng"></div></div>
  </div>
  <div class="card"><h2>Pessoas</h2><div class="scroll"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div><p class="note" id="empty"></p></div>
  </div>
</section>
</div>

<script type="module">
import {firebaseConfig} from "./firebase-config.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,setDoc,deleteDoc,collection,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const $=id=>document.getElementById(id);
let db=null,unlocked=false,sub=false,familias=[],temFam=null,lastL=[],antigas=[],ocultas=0;
const MIN=["Infantil","Mulheres","Homens","Casais","Louvor","Comunicação","Transmissão","EbD","Coral"];
const FX=["0–12","13–17","18–29","30–49","50–64","65+"];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const idade=d=>{if(!d)return null;const n=new Date(d),h=new Date();let a=h.getFullYear()-n.getFullYear();if(h<new Date(h.getFullYear(),n.getMonth(),n.getDate()))a--;return a>=0?a:null};
const fxOf=a=>a===null?"":a<=12?FX[0]:a<=17?FX[1]:a<=29?FX[2]:a<=49?FX[3]:a<=64?FX[4]:FX[5];
const fdata=d=>d?d.split("-").reverse().join("/"):"";

/* ---------- armazenamento ---------- */
function lsGet(){try{return JSON.parse(localStorage.getItem("familias")||"[]")}catch(e){return[]}}
function lsSet(a){try{localStorage.setItem("familias",JSON.stringify(a))}catch(e){}}
async function salvar(fam){await setDoc(doc(fdb,"familias",fam.id),fam)}

const app=initializeApp(firebaseConfig),fdb=getFirestore(app),auth=getAuth(app);
let unsub=null;
const chave=m=>((m.nome||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim())+"|"+(m.nasc||"");
function dedupe(arr){
  const vistos=new Set(),out=[];antigas=[];ocultas=0;
  [...arr].sort((a,b)=>(a.criadoEm||"")<(b.criadoEm||"")?1:-1).forEach(f=>{
    const ms=(f.membros||[]).filter(m=>{const k=chave(m);if(vistos.has(k)){ocultas++;return false}vistos.add(k);return true});
    if(ms.length)out.push({...f,membros:ms});else antigas.push(f);
  });
  return out;
}
async function entrar(){
  $("pwErr").textContent="";
  try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value);$("pw").value=""}
  catch(e){$("pwErr").textContent="E-mail ou senha incorretos."}
}
function lock(){signOut(auth)}
onAuthStateChanged(auth,u=>{
  unlocked=!!u;$("gate").classList.toggle("hide",!!u);$("dashBody").classList.toggle("hide",!u);
  if(unsub){unsub();unsub=null}
  if(u){unsub=onSnapshot(collection(fdb,"familias"),sn=>{familias=dedupe(sn.docs.map(x=>({...x.data(),id:x.id})));renderDash()},()=>{$("pwErr").textContent="Este usuário não tem permissão.";signOut(auth)})}
  else familias=[];
});
$("enter").onclick=entrar;$("pw").onkeydown=e=>{if(e.key==="Enter")entrar()};$("lock").onclick=lock;
async function init(){}

/* ---------- dashboard ---------- */
const F=[["nome","Nome","t"],["familia","Família","t"],["email","E-mail","t"],["tel","Telemóvel","t"],
["genero","Gênero","s"],["estcivil","Estado civil","s"],["nac","Nacionalidade","s"],["situacao","Identificação","s"],["ingresso","Como ingressou","s"],["querMembro","Deseja ser membro","s"],["parentesco","Parentesco","s"],["faixa","Faixa etária","s"],["whats","Tem WhatsApp","s"],["whatsnum","Outro WhatsApp","t"],["conversao","Ano de conversão","s"],["batAno","Ano de batismo","s"],["serve","Serve no ministério","s"],["interesse","Interesse em servir","s"]];
$("filters").innerHTML=F.map(([k,l,t])=>`<div><label>${l}</label>${t==="t"?`<input id="f_${k}" placeholder="Buscar">`:`<select id="f_${k}"><option value="">Todos</option></select>`}</div>`).join("");
F.forEach(([k,,t])=>$("f_"+k)[t==="t"?"oninput":"onchange"]=renderDash);
$("clr").onclick=()=>{F.forEach(([k])=>$("f_"+k).value="");renderDash()};
$("purge").onclick=async()=>{
  if(!antigas.length||!confirm("Apagar "+antigas.length+" cadastro(s) antigo(s) para sempre? Os mais recentes ficam."))return;
  try{for(const f of antigas)await deleteDoc(doc(fdb,"familias",f.id))}catch(e){alert("Não foi possível apagar.")}
};
$("csv").onclick=()=>{
  const H=["Nome","Família","Parentesco","Gênero","Nascimento","Idade","Estado civil","Nacionalidade","Identificação","Ingresso","Quer ser membro","E-mail","Telemóvel","Tem WhatsApp","Outro WhatsApp","Ano de conversão","Data de batismo","Serve","Interesse em servir"];
  const cell=v=>{v=String(v??"");if(/^[=@\t\r]/.test(v)||(/^[+\-]/.test(v)&&!/^[+\-][\d\s().-]*$/.test(v)))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
  const rows=lastL.map(p=>[p.nome,p.familia,p.parentesco,p.genero,p.nasc,p.idade,p.estcivil,p.nac,p.situacao,p.ingresso,p.querMembro,p.email,p.tel,p.whats,p.whatsnum,p.conversao,p.batismo,p.serve.join(", "),p.interesse.join(", ")]);
  const csv="\ufeff"+[H,...rows].map(x=>x.map(cell).join(";")).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download="cadastros-igreja-"+new Date().toISOString().slice(0,10)+".csv";document.body.appendChild(a);a.click();a.remove();
};
const pessoas=()=>familias.flatMap(f=>(f.membros||[]).map(m=>{const a=idade(m.nasc);return{...m,familia:f.familia,idade:a,faixa:fxOf(a),batAno:m.batismo?m.batismo.slice(0,4):"",serve:m.serve||[],interesse:m.interesse||[]}}));
function bars(el,obj,max=6,keep){
  let e=Object.entries(obj);if(!keep)e=e.sort((a,b)=>b[1]-a[1]).slice(0,max);
  const mx=Math.max(1,...e.map(x=>x[1]));
  $(el).innerHTML=e.some(x=>x[1])?e.map(([k,v])=>`<div class="bar"><i title="${esc(k)}">${esc(k)}</i><div><u style="width:${v/mx*100}%"></u></div><em>${v}</em></div>`).join(""):'<p class="note">Sem dados</p>';
}
const COLS=[["Nome",p=>p.nome],["Família",p=>p.familia],["Parentesco",p=>p.parentesco],["Gênero",p=>p.genero],["Estado civil",p=>p.estcivil],["Idade",p=>p.idade],["Nacionalidade",p=>p.nac],["Identificação",p=>`<span class="tag${p.situacao==="Frequentador"?" c":""}">${esc(p.situacao)}</span>`,1],["Ingresso",p=>p.ingresso],["Quer ser membro",p=>p.querMembro],["E-mail",p=>p.email],["Telemóvel",p=>p.tel],["WhatsApp",p=>p.whats==="Não"?(p.whatsnum?"Outro: "+p.whatsnum:"Não"):p.whats],["Conversão",p=>p.conversao],["Batismo",p=>fdata(p.batismo)],["Serve",p=>p.serve.join(", ")],["Interesse",p=>p.interesse.join(", ")]];
function renderDash(){
  if(!unlocked)return;
  const all=pessoas();
  F.filter(f=>f[2]==="s").forEach(([k])=>{
    const el=$("f_"+k),cur=el.value;
    let v=[...new Set(all.flatMap(p=>[].concat(p[k]||[])).map(String).filter(Boolean))];
    v=k==="faixa"?FX.filter(x=>v.includes(x)):k==="serve"||k==="interesse"?MIN.filter(x=>v.includes(x)):v.sort((a,b)=>a.localeCompare(b,"pt",{numeric:true}));
    el.innerHTML='<option value="">Todos</option>'+v.map(x=>`<option${x===cur?" selected":""}>${esc(x)}</option>`).join("");
  });
  const L=all.filter(p=>F.every(([k,,t])=>{
    const v=$("f_"+k).value;if(!v)return true;
    return t==="t"?String(p[k]||"").toLowerCase().includes(v.toLowerCase()):[].concat(p[k]||[]).map(String).includes(v);
  }));
  lastL=L;
  const cnt=fn=>L.reduce((o,p)=>{[].concat(fn(p)).filter(Boolean).forEach(k=>o[k]=(o[k]||0)+1);return o},{});
  const ages=L.map(p=>p.idade).filter(a=>a!==null),med=ages.length?Math.round(ages.reduce((a,b)=>a+b,0)/ages.length):"—";
  $("kpis").innerHTML=[[L.length,"Pessoas"],[new Set(L.map(p=>p.familia.toLowerCase())).size,"Famílias"],[L.filter(p=>p.situacao==="Membro").length,"Membros"],[L.filter(p=>p.situacao==="Frequentador").length,"Frequentadores"],[med,"Idade média"],[L.filter(p=>p.batismo).length,"Batizados"],[L.filter(p=>p.serve.length).length,"Servindo"],[L.filter(p=>p.querMembro==="Sim").length,"Querem ser membros"],[L.filter(p=>p.interesse.length).length,"Com interesse em servir"]].map(([v,l])=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join("");
  bars("cGen",cnt(p=>p.genero));bars("cSit",cnt(p=>p.situacao));bars("cNac",cnt(p=>p.nac));
  bars("cAge",{...Object.fromEntries(FX.map(x=>[x,0])),...cnt(p=>p.faixa)},6,1);
  bars("cEst",cnt(p=>p.estcivil));bars("cIng",cnt(p=>p.ingresso));bars("cSrv",cnt(p=>p.serve),9);bars("cInt",cnt(p=>p.interesse),9);
  $("th").innerHTML="<tr>"+COLS.map(c=>`<th>${c[0]}</th>`).join("")+"</tr>";
  $("tb").innerHTML=L.map(p=>"<tr>"+COLS.map(c=>`<td>${c[2]?c[1](p):esc(c[1](p)??"")||"—"}</td>`).join("")+"</tr>").join("");
  $("cntr").textContent=`${L.length} de ${all.length} pessoas`;
  $("purge").classList.toggle("hide",!antigas.length);$("oldNote").textContent=ocultas?ocultas+" versão(ões) antiga(s) de pessoas atualizadas (ocultas)":"";
  $("empty").textContent=L.length?"":"Nenhum resultado para estes filtros.";
}

</script>
</body>
</html>
